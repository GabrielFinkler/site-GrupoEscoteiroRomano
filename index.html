      <h1>Grupo Escoteiro Romano 350/RS — Escotismo em Porto Alegre</h1>
      <p>Somos o Grupo Escoteiro Romano 350/RS, localizado em Porto Alegre, RS. Formamos jovens para a vida através de aventura, amizade e aprendizado no Movimento Escoteiro.</p>
      <h2>Quem Somos</h2>
      <p>Somos um grupo escoteiro dedicado ao desenvolvimento de jovens através de atividades ao ar livre, liderança e trabalho em equipe. Baseados nos valores do escotismo mundial, formamos cidadãos conscientes, responsáveis e prontos para contribuir com a sociedade.</p>
      <h2>Nossos Ramos</h2>
      <ul>
        <li><strong>Alcateia Apenine</strong> (6,5 a 10 anos) — Onde a aventura começa! Aprender brincando em um ambiente inspirado nas histórias do Livro da Selva.</li>
        <li><strong>Tropa Escoteira Centúria</strong> (11 a 14 anos) — Vida ao ar livre, acampamentos, sistema de patrulhas e o desenvolvimento do espírito de equipe.</li>
        <li><strong>Tropa Sênior Coliseu</strong> (15 a 17 anos) — Desafios físicos e mentais, superação de limites e atividades de grande aventura.</li>
        <li><strong>Clã Pioneiro Pantheon</strong> (18 a 22 anos) — Foco no serviço ao próximo, projetos solidários e preparação ativa para a vida adulta.</li>
      </ul>
